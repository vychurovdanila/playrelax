<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- maximum-scale + user-scalable=no — запрет зума при свайпах (критично для мобилки) -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>playrelax</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Видеофон Kinescope. Рендерится на самом дне (z-index: 0), но выше body,
       поэтому при загрузке виден сразу. Кнопка старта — поверх него. -->
  <div class="bg-video">
    <!-- autoplay=1&mute=1 — плеер Kinescope запускает видео сам, без звука
         (звук музыки идёт отдельно через Howler), поэтому экран с кнопкой
         Play не показывается. -->
    <iframe id="bg-iframe" src="https://kinescope.io/embed/nszJ4cfocx4KjVkpCdx83T?autoplay=1&mute=1" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
  </div>

  <!-- ЭКРАН СТАРТА: виден при загрузке, скрывается по клику.
       Тетрис (canvas) до этого невидим и не принимает клики. -->
  <div id="start-screen">
    <button id="start-btn" type="button">Начать</button>
  </div>

  <!-- Панель управления музыкой -->
  <div id="music-controls">
    <button id="music-play" type="button" aria-label="Играть">▶</button>
    <button id="music-next" type="button" aria-label="Следующий трек">⏭</button>
    <button id="music-shuffle" type="button" aria-label="Режим: По порядку" data-active="false">🔀</button>
  </div>

  <!-- Канвас идёт ПОСЛЕ кнопки старта. -->
  <canvas id="game" width="320" height="640"></canvas>

  <script src="vendor/howler.min.js"></script>
  <script src="audio.js"></script>
  <script src="game.js"></script>
</body>
</html>
