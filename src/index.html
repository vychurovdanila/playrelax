<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- maximum-scale + user-scalable=no — запрет зума при свайпах (критично для мобилки).
       viewport-fit=cover — контент заходит под системные панели (вырез, home-бар),
       поэтому снизу не остаётся тёмной полосы-отступа. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>playrelax</title>
  <!-- Шрифты Google Fonts: Nata Sans — интерфейс, Tiny5 — пиксельные заголовки.
       preconnect — соединение с fonts.googleapis.com/gstatic.com открывается
       заранее, чтобы запрос шрифта не ждал лишнего рукопожатия. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nata+Sans:wght@100;200;300;400;500;600;700;800;900&family=Tiny5&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Видеофон Kinescope: ДВА iframe друг поверх друга для плавного кроссфейда
       при смене мира (.bg-iframe.active виден, второй скрыт и заранее
       подгружается — см. switchWorld в src/game.js). -->
  <div class="bg-video">
    <!-- autoplay=1&mute=1 — плеер Kinescope запускает видео сам, без звука
         (звук музыки идёт отдельно через Howler), поэтому экран с кнопкой
         Play не показывается. -->
    <iframe id="bg-iframe-1" class="bg-iframe active" src="https://kinescope.io/embed/nszJ4cfocx4KjVkpCdx83T?autoplay=1&mute=1&loop=1&controls=0" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
    <!-- Второй iframe пуст: в него switchWorld подставит следующее видео. -->
    <iframe id="bg-iframe-2" class="bg-iframe" src="" frameborder="0" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
  </div>

  <!-- Затемняющая плашка поверх видеофона.
       z-index: 1 — выше .bg-iframe (0), ниже канваса (10) и кнопок (100).
       pointer-events: none — свайпы по канвасу проходят сквозь плашку. -->
  <div id="overlay"></div>

  <!-- ГЛАВНОЕ МЕНЮ (пиксельный дизайн из прототипов).
       Виден при загрузке поверх видеофона, скрывается по кнопке [ НАЧАЛО ].
       Раньше здесь был простой #start-screen с кнопкой «Начать» — заменён
       на этот экран, чтобы не было дубликата id="start-btn". -->
  <div id="ui-layer">
    <!-- Главное меню -->
    <div id="main-menu" class="screen active">
      <div class="top-logo">
        <div class="logo-title">[ PLAY RELAX ]</div>
        <div class="logo-version">version 1</div>
      </div>

      <div class="menu-list">
        <div class="menu-row">
          <span class="menu-label">ВНИМАНИЕ</span>
          <span class="menu-value"><span class="arrow">&lt;</span> match3 <span class="arrow">&gt;</span></span>
        </div>
        <div class="menu-row">
          <span class="menu-label">ОКРУЖЕНИЕ</span>
          <span class="menu-value"><span class="arrow">&lt;</span> fog forest <span class="arrow">&gt;</span></span>
        </div>
        <div class="menu-row">
          <span class="menu-label">НАСТРОЕНИЕ</span>
          <span class="menu-value"><span class="arrow">&lt;</span> quiet spring <span class="arrow">&gt;</span></span>
        </div>
        <div class="menu-row">
          <span class="menu-label">ИСТОРИЯ</span>
          <span class="menu-value"><span class="arrow">&lt;</span> something <span class="arrow">&gt;</span></span>
        </div>
        <div class="menu-row">
          <span class="menu-label">ПЕРСОНА</span>
          <span class="menu-value"><span class="arrow">&lt;</span> олень <span class="arrow">&gt;</span></span>
        </div>
      </div>

      <div class="bottom-action">
        <button id="start-btn" class="pixel-btn" type="button">[ НАЧАЛО ]</button>
      </div>
    </div>
  </div>

  <!-- Панель управления музыкой: осталась ОДНА кнопка — вкл/выкл звука.
       Переключение трека и shuffle больше не нужны: порядок треков случайный
       по умолчанию (см. AudioManager.forceShuffle в src/audio.js). -->
  <button id="btn-unmute" type="button" aria-label="Выключить звук" aria-pressed="false">🔊</button>

  <!-- Канвас идёт ПОСЛЕ кнопки старта. -->
  <canvas id="game" width="320" height="640"></canvas>

  <script src="vendor/howler.min.js"></script>
  <script src="audio.js"></script>
  <script src="particles.js"></script>
  <script src="video.js"></script>
  <script src="tetris.js"></script>
  <script src="match3.js"></script>
  <script src="gestures.js"></script>
  <script src="main.js"></script>
</body>
</html>
